# Global tool set for the opencode server, installed at image build time.
# Runtimes are pinned to a release line and get its newest patch on every
# build; CLIs track the latest release available when the image was built. At
# runtime, install more tools with `mise use <tool>@<version>` (see the
# use-mise skill) — those persist on the volume.
[tools]
node = "26"
python = "3.15"
go = "latest"
bun = "latest"
pnpm = "latest"
uv = "latest"
gh = "latest"
railway = "latest"
