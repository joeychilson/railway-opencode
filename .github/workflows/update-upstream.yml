name: update-upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check latest OpenCode release
        id: version
        run: |
          latest="$(npm view opencode-ai version)"
          current="$(sed -n 's/^ARG OPENCODE_VERSION=//p' Dockerfile)"
          if ! printf '%s' "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected OpenCode release: $latest" >&2
            exit 1
          fi
          if ! printf '%s' "$current" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected OPENCODE_VERSION: $current" >&2
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update OpenCode pin
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.latest }}
        run: |
          sed -i -E "s/^ARG OPENCODE_VERSION=.*/ARG OPENCODE_VERSION=${VERSION}/" Dockerfile
          grep -qxF "ARG OPENCODE_VERSION=${VERSION}" Dockerfile

      - name: Open pull request
        id: pr
        if: steps.version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: update/opencode
          commit-message: "Bump OpenCode to ${{ steps.version.outputs.latest }}"
          title: "Bump OpenCode to ${{ steps.version.outputs.latest }}"
          body: |
            Updates OpenCode from `${{ steps.version.outputs.current }}` to `${{ steps.version.outputs.latest }}`.

            Release notes: https://github.com/anomalyco/opencode/releases/tag/v${{ steps.version.outputs.latest }}

            CI smoke-tests this change. Review the upstream release notes before merging, then publish a wrapper patch release.
          delete-branch: true

      - name: Run CI on update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH" --repo "${{ github.repository }}"
